<div class="container">
  <div class="card">
    <div class="card-header">
      <h2>Welcome Back</h2>
      <p>Please sign in to your account</p>
    </div>
    
    <div class="card-body">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="username">Username</label>
          <input 
            type="text" 
            id="username" 
            formControlName="username" 
            class="form-control" 
            [class.is-invalid]="submitted && f['username'].invalid"
            placeholder="Enter your username">
          <div *ngIf="submitted && f['username'].invalid" class="invalid-feedback">
            <div *ngIf="f['username'].errors?.['required']">Username is required</div>
            <div *ngIf="f['username'].errors?.['minlength']">Username must be at least 3 characters</div>
          </div>
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            formControlName="password" 
            class="form-control" 
            [class.is-invalid]="submitted && f['password'].invalid"
            placeholder="Enter your password">
          <div *ngIf="submitted && f['password'].invalid" class="invalid-feedback">
            <div *ngIf="f['password'].errors?.['required']">Password is required</div>
            <div *ngIf="f['password'].errors?.['minlength']">Password must be at least 6 characters</div>
          </div>
        </div>
        
        <div *ngIf="error" class="alert alert-danger">
          {{ error }}
        </div>
        
        <button type="submit" class="btn btn-primary" [disabled]="loading">
          <span *ngIf="loading" class="spinner"></span>
          <span *ngIf="!loading">Sign In</span>
          <span *ngIf="loading">Signing in...</span>
        </button>
        
        <div class="text-center">
          <a routerLink="/signup">Don't have an account? Sign up</a>
        </div>
      </form>
    </div>
  </div>
</div>
